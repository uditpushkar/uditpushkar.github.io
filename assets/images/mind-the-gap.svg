<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mind the Gap</title>
  <desc id="desc">A stylized editorial illustration of a quiet city crossing, a tennis court line, and two separated platforms.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4efe3"/>
      <stop offset="0.45" stop-color="#d8e4df"/>
      <stop offset="1" stop-color="#28333f"/>
    </linearGradient>
    <linearGradient id="street" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#51606b"/>
      <stop offset="1" stop-color="#171d24"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.16"/>
      </feComponentTransfer>
      <feBlend mode="soft-light" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <g opacity="0.22">
    <rect x="140" y="156" width="132" height="420" rx="8" fill="#26313c"/>
    <rect x="318" y="116" width="94" height="500" rx="8" fill="#26313c"/>
    <rect x="1150" y="130" width="114" height="470" rx="8" fill="#26313c"/>
    <rect x="1305" y="180" width="142" height="400" rx="8" fill="#26313c"/>
  </g>
  <path d="M0 614 C310 540 496 548 706 614 C918 681 1178 650 1600 548 L1600 900 L0 900 Z" fill="url(#street)"/>
  <path d="M718 578 L884 578 L1042 900 L526 900 Z" fill="#0c1016" opacity="0.88"/>
  <g fill="none" stroke="#f7efe2" stroke-width="16" stroke-linecap="round" opacity="0.88">
    <path d="M135 750 H565"/>
    <path d="M1035 750 H1464"/>
    <path d="M270 835 H625"/>
    <path d="M975 835 H1330"/>
  </g>
  <g fill="none" stroke="#f9c74f" stroke-width="10" stroke-linecap="round" opacity="0.9">
    <path d="M786 652 V710"/>
    <path d="M786 756 V814"/>
    <path d="M814 652 V710"/>
    <path d="M814 756 V814"/>
  </g>
  <circle cx="800" cy="334" r="86" fill="#f9c74f" opacity="0.95"/>
  <circle cx="800" cy="334" r="44" fill="#28333f"/>
  <path d="M760 334 H840" stroke="#f4efe3" stroke-width="13" stroke-linecap="round"/>
  <text x="800" y="146" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="78" fill="#202833" font-weight="700">Mind the Gap</text>
  <text x="800" y="222" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#3c4854">between breath, street, wage, country and forehand</text>
  <g filter="url(#grain)">
    <rect width="1600" height="900" fill="transparent"/>
  </g>
</svg>
